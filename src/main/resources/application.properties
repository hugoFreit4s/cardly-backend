spring.application.name=cardly-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cardly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

cardly.jwt.secret=${CARDLY_JWT_SECRET:local-dev-jwt-secret-at-least-32-characters-long}
cardly.jwt.expiration-seconds=${CARDLY_JWT_EXPIRATION_SECONDS:3600}
cardly.google.client-id=${CARDLY_GOOGLE_CLIENT_ID:}

cardly.cors.allowed-origins=${CARDLY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006}
